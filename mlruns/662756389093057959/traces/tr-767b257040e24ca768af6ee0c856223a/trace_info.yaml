  the practice of tracking and managing different iterations of your models throughout
  their lifecycle.  Each time you train a new model, make a change to an existing
  model, or even retrain a model on new data, you create a new \"version\" of that
  model.  You then keep a record of each version, its characteristics, and its performance.\n\n**Why
